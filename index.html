<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #b8975a;
    --gold-light: #d4b47a;
    --gold-pale: #f5efe0;
    --ink: #1a1410;
    --ink-mid: #3d3228;
    --ink-soft: #6b5a4a;
    --paper: #faf6ef;
    --paper-dark: #f0e8d8;
    --line: rgba(184,151,90,0.25);
    --radius: 8px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans JP', sans-serif;
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
  }

  /* ── HEADER ── */
  header {
    background: var(--ink);
    padding: 40px 24px 32px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  header::before {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      45deg,
      transparent,
      transparent 18px,
      rgba(184,151,90,0.04) 18px,
      rgba(184,151,90,0.04) 19px
    );
  }
  .header-kamon {
    width: 48px; height: 48px;
    margin: 0 auto 16px;
    border: 1.5px solid var(--gold);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: var(--gold);
    font-size: 22px;
    position: relative;
  }
  .header-kamon::before {
    content: '';
    position: absolute;
    inset: 4px;
    border: 1px solid rgba(184,151,90,0.35);
    border-radius: 50%;
  }
  h1 {
    font-family: 'Noto Serif JP', serif;
    font-size: clamp(20px, 5vw, 28px);
    font-weight: 700;
    color: #fff;
    letter-spacing: 0.12em;
    line-height: 1.4;
  }
  .header-sub {
    font-size: 12px;
    color: var(--gold-light);
    letter-spacing: 0.2em;
    margin-top: 8px;
    text-transform: uppercase;
  }
  .header-line {
    width: 60px; height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    margin: 14px auto 0;
  }

  /* ── CONTROLS ── */
  .controls {
    background: var(--paper-dark);
    border-bottom: 1px solid var(--line);
    padding: 16px 20px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 12px rgba(26,20,16,0.06);
  }
  .search-wrap {
    position: relative;
    max-width: 480px;
    margin: 0 auto 12px;
  }
  .search-icon {
    position: absolute;
    left: 12px; top: 50%;
    transform: translateY(-50%);
    color: var(--gold);
    font-size: 14px;
    pointer-events: none;
  }
  #search {
    width: 100%;
    padding: 10px 14px 10px 36px;
    border: 1px solid var(--line);
    border-radius: 24px;
    background: var(--paper);
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 14px;
    color: var(--ink);
    outline: none;
    transition: border-color .2s, box-shadow .2s;
  }
  #search:focus {
    border-color: var(--gold);
    box-shadow: 0 0 0 3px rgba(184,151,90,0.12);
  }
  #search::placeholder { color: var(--ink-soft); }
  .filters {
    display: flex; flex-wrap: wrap; gap: 6px;
    justify-content: center;
  }
  .filter-btn {
    padding: 5px 14px;
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 12px;
    letter-spacing: 0.05em;
    border: 1px solid var(--line);
    border-radius: 20px;
    background: transparent;
    color: var(--ink-soft);
    cursor: pointer;
    transition: all .18s;
    white-space: nowrap;
  }
  .filter-btn:hover { border-color: var(--gold); color: var(--ink); }
  .filter-btn.active {
    background: var(--ink);
    color: var(--gold-light);
    border-color: var(--ink);
  }

  /* ── MAIN ── */
  main {
    max-width: 900px;
    margin: 0 auto;
    padding: 28px 16px 60px;
  }
  .stats {
    font-size: 12px;
    color: var(--ink-soft);
    text-align: right;
    margin-bottom: 20px;
    letter-spacing: 0.05em;
  }
  .stats strong { color: var(--gold); }

  /* ── SECTION ── */
  .section { margin-bottom: 32px; }
  .section-head {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
  }
  .section-icon {
    width: 28px; height: 28px;
    background: var(--ink);
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
    flex-shrink: 0;
  }
  .section-title {
    font-family: 'Noto Serif JP', serif;
    font-size: 15px;
    font-weight: 700;
    color: var(--ink);
    letter-spacing: 0.08em;
  }
  .section-bar {
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, var(--line), transparent);
  }
  .section-count {
    font-size: 11px;
    color: var(--gold);
    font-weight: 500;
    letter-spacing: 0.05em;
  }

  /* ── GRID ── */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 8px;
  }
  .card {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 10px 12px;
    cursor: default;
    transition: border-color .15s, box-shadow .15s, transform .15s;
    position: relative;
    overflow: hidden;
  }
  .card::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--gold);
    opacity: 0;
    transition: opacity .15s;
    border-radius: 2px 0 0 2px;
  }
  .card:hover {
    border-color: rgba(184,151,90,0.45);
    box-shadow: 0 2px 12px rgba(26,20,16,0.07);
    transform: translateY(-1px);
  }
  .card:hover::before { opacity: 1; }
  .card-title {
    font-size: 13px;
    font-weight: 500;
    color: var(--ink);
    line-height: 1.5;
  }
  .card-desc {
    font-size: 11px;
    color: var(--ink-soft);
    margin-top: 4px;
    line-height: 1.5;
  }

  .card-link { cursor: pointer; }
  .card-link:hover { border-color: #e1306c; box-shadow: 0 2px 12px rgba(225,48,108,0.12); }
  .card-link:hover::before { opacity: 1; background: #e1306c; }
  .card-ig-badge {
    font-size: 10px;
    color: #e1306c;
    font-weight: 500;
    letter-spacing: 0.05em;
    margin-bottom: 4px;
  }

  /* ── EMPTY ── */
  .no-result {
    text-align: center;
    padding: 60px 20px;
    color: var(--ink-soft);
  }
  .no-result .nr-icon { font-size: 32px; margin-bottom: 12px; }
  .no-result p { font-size: 14px; }

  /* ── FOOTER ── */
  footer {
    background: var(--ink);
    text-align: center;
    padding: 20px;
    font-size: 11px;
    color: rgba(212,180,122,0.5);
    letter-spacing: 0.1em;
  }

  /* ── HIGHLIGHT ── */
  mark {
    background: rgba(184,151,90,0.25);
    color: inherit;
    border-radius: 2px;
    padding: 0 1px;
  }

  @media (max-width: 480px) {
    .grid { grid-template-columns: 1fr 1fr; }
    .card-title { font-size: 12px; }
    .card-desc { display: none; }
  }
</style>
</head>

let activeFilter = "すべて";

function esc(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function highlight(text, query) {
  if (!query) return esc(text);
  const q = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return esc(text).replace(new RegExp(q, 'gi'), m => `<mark>${m}</mark>`);
}

function render() {
  const query = document.getElementById('search').value.trim().toLowerCase();
  const filtered = CATS
    .filter(s => activeFilter === 'すべて' || s.name === activeFilter)
    .map(s => ({
      ...s,
      items: s.items.filter(([t, d]) =>
        t.toLowerCase().includes(query) || d.toLowerCase().includes(query)
      )
    }))
    .filter(s => s.items.length > 0);

  const totalAll = CATS.reduce((a, s) => a + s.items.length, 0);
  const totalShown = filtered.reduce((a, s) => a + s.items.length, 0);
  document.getElementById('stats').innerHTML =
    `全 <strong>${totalAll}</strong> 本 &nbsp;／&nbsp; 表示中 <strong>${totalShown}</strong> 本`;

  const content = document.getElementById('content');
  if (filtered.length === 0) {
    content.innerHTML = `<div class="no-result"><div class="nr-icon">🔍</div><p>「${esc(query)}」に該当する動画が見つかりません</p></div>`;
    return;
  }

  content.innerHTML = filtered.map(s => `
    <div class="section">
      <div class="section-head">
        <div class="section-icon">${s.icon}</div>
        <span class="section-title">${esc(s.name)}</span>
        <div class="section-bar"></div>
        <span class="section-count">${s.items.length}本</span>
      </div>
      <div class="grid">
        ${s.items.map(([title, desc, url]) => `
          <div class="card${url ? ' card-link' : ''}" ${url ? `onclick="window.open('${url}','_blank')"` : ''}>
            ${url ? '<div class="card-ig-badge">▶ Instagram</div>' : ''}
            <div class="card-title">${highlight(title, query)}</div>
            ${desc ? `<div class="card-desc">${highlight(desc, query)}</div>` : ''}
          </div>
        `).join('')}
      </div>
    </div>
  `).join('');
}

// Build filter buttons
const filterRow = document.getElementById('filters');
['すべて', ...CATS.map(c => c.name)].forEach(name => {
  const btn = document.createElement('button');
  btn.className = 'filter-btn' + (name === 'すべて' ? ' active' : '');
  btn.textContent = name;
  btn.onclick = () => {
    activeFilter = name;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render();
  };
  filterRow.appendChild(btn);
});

render();
