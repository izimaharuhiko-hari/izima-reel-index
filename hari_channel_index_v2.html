<style>
:root {
  --gold: #C9A84C;

*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Sans JP',sans-serif;background:var(--cream2);color:var(--text);min-height:100vh;}

/* HERO */
.hero{
  background:var(--dark);
  background-image:
    radial-gradient(ellipse at 20% 50%,rgba(201,168,76,.08) 0%,transparent 60%),
    radial-gradient(ellipse at 80% 20%,rgba(201,168,76,.05) 0%,transparent 50%),
    repeating-linear-gradient(45deg,transparent,transparent 40px,rgba(201,168,76,.02) 40px,rgba(201,168,76,.02) 41px);
  padding:52px 24px 36px;
  text-align:center;
  position:relative;
}
.hero::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);}
.hero-emblem{width:60px;height:60px;border:1.5px solid var(--gold);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 18px;font-family:'Noto Serif JP',serif;font-size:20px;color:var(--gold);background:rgba(201,168,76,.08);}
.hero h1{font-family:'Noto Serif JP',serif;font-size:26px;font-weight:700;color:#fff;line-height:1.5;letter-spacing:.05em;margin-bottom:4px;}
.hero-sub{font-size:11px;letter-spacing:.25em;color:var(--gold);text-transform:uppercase;margin-bottom:8px;}
.hero-desc{font-size:12px;color:rgba(255,255,255,.45);margin-top:8px;}

/* CONTROLS */
.controls{background:var(--cream);padding:18px 16px 14px;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;}
.search-wrap{position:relative;max-width:600px;margin:0 auto 12px;}
.search-wrap svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--gold);}
.search-input{width:100%;padding:9px 16px 9px 40px;border:1px solid var(--border);border-radius:999px;background:#fff;font-family:'Noto Sans JP',sans-serif;font-size:13px;color:var(--text);outline:none;transition:border-color .2s;}
.search-input:focus{border-color:var(--gold);}
.search-input::placeholder{color:#9A8E7E;}

/* TYPE TABS */
.type-tabs{display:flex;gap:0;max-width:360px;margin:0 auto 12px;border:1px solid var(--border);border-radius:999px;overflow:hidden;background:#fff;}
.type-tab{flex:1;padding:7px 0;border:none;background:transparent;font-family:'Noto Sans JP',sans-serif;font-size:13px;color:var(--text-muted);cursor:pointer;transition:all .15s;text-align:center;}
.type-tab.active{background:var(--dark);color:var(--gold);}

/* FILTER TABS */
.filter-tabs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:700px;margin:0 auto;}
.filter-tab{padding:4px 12px;border-radius:999px;border:1px solid var(--border);background:transparent;font-family:'Noto Sans JP',sans-serif;font-size:11px;color:var(--text-muted);cursor:pointer;transition:all .15s;white-space:nowrap;}
.filter-tab.active{background:var(--dark);color:var(--gold);border-color:var(--dark);}
.filter-tab:hover:not(.active){border-color:var(--gold);color:var(--gold-dark);}

/* MAIN */
.main{max-width:980px;margin:0 auto;padding:22px 16px 48px;}
.count-bar{text-align:right;font-size:11px;color:var(--text-muted);margin-bottom:18px;}
.count-bar span{color:var(--text);font-weight:500;}

/* SECTION */
.section{margin-bottom:32px;}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border);}
.section-title{display:flex;align-items:center;gap:9px;font-family:'Noto Serif JP',serif;font-size:15px;font-weight:600;color:var(--text);}
.section-icon{width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:13px;}
.section-count{font-size:11px;color:var(--gold);font-weight:500;}

/* CARD GRID */
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;}

.card{background:var(--card-bg);border:1px solid rgba(201,168,76,.2);border-radius:10px;padding:12px 14px;cursor:pointer;transition:all .18s;text-decoration:none;display:block;position:relative;overflow:hidden;}
.card::before{content:'';position:absolute;top:0;left:0;width:3px;height:100%;background:var(--cat-color,var(--gold));opacity:.6;}
.card:hover{border-color:var(--gold);transform:translateY(-2px);box-shadow:0 4px 14px rgba(139,105,20,.12);}

/* SHORT card style */
.card.short-card{border-radius:10px;}
.card.short-card::before{background:var(--cat-color,#E53935);}

.card-platform{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--text-muted);margin-bottom:5px;letter-spacing:.05em;}
.yt-icon{width:14px;height:10px;background:#FF0000;border-radius:2px;position:relative;display:inline-block;flex-shrink:0;}
.yt-icon::after{content:'';position:absolute;left:50%;top:50%;transform:translate(-30%,-50%);border-left:5px solid white;border-top:3px solid transparent;border-bottom:3px solid transparent;}
.short-badge{display:inline-flex;align-items:center;gap:3px;background:#FF0000;color:#fff;font-size:9px;font-weight:700;padding:1px 6px;border-radius:3px;letter-spacing:.05em;}

.card-title{font-size:13px;font-weight:700;color:var(--text);line-height:1.45;margin-bottom:4px;}
.card-desc{font-size:10px;color:var(--text-muted);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}

/* LOADING / EMPTY */
.loading{text-align:center;padding:60px 0;color:var(--text-muted);}
.empty{text-align:center;padding:40px 0;color:var(--text-muted);font-size:13px;}

@media(max-width:480px){
  .hero h1{font-size:20px;}
  .card-grid{grid-template-columns:1fr 1fr;}
}
</style>

const LONG_WITH_TYPE  = LONG .map(v=>({...v, type:'ロング'}));
const SHORT_WITH_TYPE = SHORT.map(v=>({...v, type:'ショート'}));
const ALL_VIDEOS = [...LONG_WITH_TYPE, ...SHORT_WITH_TYPE];

const CAT_ORDER = ['症状・疾患','ツボ・経穴','東洋医学・理論','セルフケア・養生','施術・治療紹介','その他'];

let currentType = 'すべて';
let currentCat  = 'すべて';
let currentQ    = '';

function render(){
  let list = ALL_VIDEOS;
  if(currentType !== 'すべて') list = list.filter(v=>v.type===currentType);
  if(currentCat  !== 'すべて') list = list.filter(v=>v.cat===currentCat);
  if(currentQ){
    const q=currentQ.toLowerCase();
    list=list.filter(v=>v.title.toLowerCase().includes(q)||(v.desc||'').toLowerCase().includes(q));
  }

  const total=ALL_VIDEOS.length, shown=list.length;
  document.getElementById('countBar').innerHTML=
    `全 <span>${total}</span> 本 ／ 表示中 <span>${shown}</span> 本`;

  if(!list.length){
    document.getElementById('content').innerHTML='<div class="empty">該当する動画が見つかりませんでした。</div>';
    return;
  }

  // Group by category within current filter
  const groups={};
  list.forEach(v=>{ if(!groups[v.cat])groups[v.cat]=[]; groups[v.cat].push(v); });

  let html='';
  CAT_ORDER.forEach(cat=>{
    if(!groups[cat])return;
    const vids=groups[cat];
    const color=CAT_COLORS[cat]||'#4A4A4A';
    const icon=CAT_ICONS[cat]||'▶';
    html+=`<section class="section">
      <div class="section-header">
        <div class="section-title">
          <div class="section-icon" style="background:${color}15;color:${color}">${icon}</div>
          ${cat}
        </div>
        <span class="section-count">${vids.length}本</span>
      </div>
      <div class="card-grid">
        ${vids.map(v=>{
          const isShort=v.type==='ショート';
          return `<a class="card${isShort?' short-card':''}"
            href="https://www.youtube.com/channel/${CHANNEL_ID}" target="_blank"
            style="--cat-color:${color}">
            <div class="card-platform">
              <span class="yt-icon"></span>
              ${isShort?'<span class="short-badge">SHORT</span>':'YouTube'}
            </div>
            <div class="card-title">${v.title}</div>
            ${v.desc?`<div class="card-desc">${v.desc}</div>`:''}
          </a>`;
        }).join('')}
      </div>
    </section>`;
  });
  document.getElementById('content').innerHTML=html;
}

// Events
document.getElementById('searchInput').addEventListener('input',e=>{currentQ=e.target.value;render();});
document.getElementById('typeTabs').addEventListener('click',e=>{
  const b=e.target.closest('.type-tab'); if(!b)return;
  document.querySelectorAll('.type-tab').forEach(x=>x.classList.remove('active'));
  b.classList.add('active'); currentType=b.dataset.type; render();
});
document.getElementById('filterTabs').addEventListener('click',e=>{
  const b=e.target.closest('.filter-tab'); if(!b)return;
  document.querySelectorAll('.filter-tab').forEach(x=>x.classList.remove('active'));
  b.classList.add('active'); currentCat=b.dataset.cat; render();
});

render();
</script>
