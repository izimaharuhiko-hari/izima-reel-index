const ALL=[...LONG,...SHORT_RAW];
let currentType='すべて',currentCat='すべて',currentQ='';

function render(){
  let list=ALL;
  if(currentType!=='すべて') list=list.filter(v=>v.type===currentType);
  if(currentCat!=='すべて')  list=list.filter(v=>v.cat===currentCat);
  if(currentQ){const q=currentQ.toLowerCase();list=list.filter(v=>v.title.toLowerCase().includes(q));}
  document.getElementById('countBar').innerHTML=`全 <span>${ALL.length}</span> 本 ／ 表示中 <span>${list.length}</span> 本`;
  if(!list.length){document.getElementById('content').innerHTML='<div class="empty">該当する動画が見つかりませんでした。</div>';return;}
  const groups={};
  list.forEach(v=>{if(!groups[v.cat])groups[v.cat]=[];groups[v.cat].push(v);});
  if(currentCat==='すべて'||currentCat===FEATURED_CAT){
    const featured=list.filter(v=>v.featured);
    if(featured.length){groups[FEATURED_CAT]=featured;}
  }
  let html='';
  CAT_ORDER.forEach(cat=>{
    if(!groups[cat])return;
    const vids=groups[cat],color=CAT_COLORS[cat]||'#4A4A4A',icon=CAT_ICONS[cat]||'▶';
    html+=`<section class="section">
      <div class="section-header">
        <div class="section-title"><div class="section-icon" style="background:${color}18;color:${color}">${icon}</div>${cat}</div>
        <span class="section-count">${vids.length}本</span>
      </div>
      <div class="card-grid">
        ${vids.map(v=>`<a class="card" href="${v.url}" target="_blank" style="--cat-color:${color}">
          <div class="card-platform"><span class="yt-icon"></span>${v.type==='ショート'?'<span class="short-badge">SHORT</span>':'YouTube'}</div>
          <div class="card-title">${v.title}</div>
        </a>`).join('')}
      </div>
    </section>`;
  });
  document.getElementById('content').innerHTML=html;
}

document.getElementById('searchInput').addEventListener('input',e=>{currentQ=e.target.value;render();});
document.getElementById('typeTabs').addEventListener('click',e=>{
  const b=e.target.closest('.type-tab');if(!b)return;
  document.querySelectorAll('.type-tab').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');currentType=b.dataset.type;render();
});
document.getElementById('filterTabs').addEventListener('click',e=>{
  const b=e.target.closest('.filter-tab');if(!b)return;
  document.querySelectorAll('.filter-tab').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');currentCat=b.dataset.cat;render();
});
render();
</script>
