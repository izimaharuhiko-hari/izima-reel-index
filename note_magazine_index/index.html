const ALL=[];
MAG_ORDER.forEach(k=>{
  RAW[k].forEach(([title,url],i)=>{
    ALL.push({mag:k,num:i+1,title,url});
  });
});

let currentCat='すべて',currentQ='';

function render(){
  let list=ALL;
  if(currentCat!=='すべて') list=list.filter(v=>v.mag===currentCat);
  if(currentQ){const q=currentQ.toLowerCase();list=list.filter(v=>v.title.toLowerCase().includes(q));}

  document.getElementById('countBar').innerHTML=`全 <span>${ALL.length}</span> 記事 ／ 表示中 <span>${list.length}</span> 記事`;

  if(!list.length){document.getElementById('content').innerHTML='<div class="empty">該当する記事が見つかりませんでした。</div>';return;}

  const groups={};
  list.forEach(v=>{if(!groups[v.mag])groups[v.mag]=[];groups[v.mag].push(v);});

  let html='';
  MAG_ORDER.forEach(mag=>{
    if(!groups[mag])return;
    const arts=groups[mag],meta=MAG_META[mag];
    html+=`<section class="section">
      <div class="section-header">
        <div class="section-title"><div class="section-icon" style="background:${meta.color}18;color:${meta.color}">${meta.icon}</div>${meta.title}</div>
        <span class="section-count">${arts.length}記事</span>
      </div>
      <div class="card-grid">
        ${arts.map(v=>`<a class="card" href="${v.url}" target="_blank" style="--cat-color:${meta.color}">
          <div class="card-platform"><span class="note-badge">n</span>note</div>
          <div class="card-title"><span class="card-num">${v.num}.</span> ${v.title}</div>
        </a>`).join('')}
      </div>
    </section>`;
  });
  document.getElementById('content').innerHTML=html;
}

document.getElementById('searchInput').addEventListener('input',e=>{currentQ=e.target.value;render();});
document.getElementById('filterTabs').addEventListener('click',e=>{
  const b=e.target.closest('.filter-tab');if(!b)return;
  document.querySelectorAll('.filter-tab').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');currentCat=b.dataset.cat;render();
});

render();
</script>
